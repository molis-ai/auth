spring.application.name=auth-example-service
server.address=127.0.0.1
server.port=${DEMO_PORT:41990}
server.error.include-message=never
server.error.include-stacktrace=never
demo.allow-loopback-http=${DEMO_ALLOW_LOOPBACK_HTTP:false}
molis.auth.issuer=${AUTH_ISSUER}
molis.auth.client-id=${AUTH_SERVICE_CLIENT_ID}
molis.auth.client-secret=${AUTH_SERVICE_CLIENT_SECRET}
molis.auth.allow-loopback-http=${DEMO_ALLOW_LOOPBACK_HTTP:false}
spring.datasource.url=${DEMO_DB_URL}
spring.datasource.username=${DEMO_DB_USER}
spring.datasource.password=${DEMO_DB_PASSWORD}
spring.datasource.hikari.connection-init-sql=SET time_zone = '+00:00'
spring.flyway.locations=classpath:db/demo-migration
spring.flyway.table=demo_flyway_schema_history
mybatis.configuration.map-underscore-to-camel-case=true
mybatis.configuration.local-cache-scope=STATEMENT
