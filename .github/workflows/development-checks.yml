name: Development checks

# Validation only. Cloudflare non-production branch builds are disabled.
# Production release/deployment remains a separate, explicitly authorized task.
on:
  push:
    branches: [main, "codex/**"]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: development-checks-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Auth build and tests
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      CI: 'true'
      WRANGLER_SEND_METRICS: 'false'
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: 24.22.1
      - name: Install pinned dependencies and Rust tools
        run: npm run setup
      - name: Check formatting
        run: npm run format:check
      - name: Install Clippy and check both feature configurations
        run: |
          toolchain=$(node --input-type=module -e "import { installedToolchain } from './worker/scripts/rust-toolchain.mjs'; process.stdout.write(installedToolchain())")
          rustup component add --toolchain "$toolchain" clippy
          npm run clippy
      - name: Build the locked wasm-bindgen CLI
        run: |
          # worker-build otherwise fetches a prebuilt binary from GitHub Releases.
          version=$(awk -F '"' '/^name = "wasm-bindgen"$/ { getline; print $2; exit }' worker/rust/Cargo.lock)
          test -n "$version"
          toolchain=$(node --input-type=module -e "import { installedToolchain } from './worker/scripts/rust-toolchain.mjs'; process.stdout.write(installedToolchain())")
          cargo "+$toolchain" install --locked --version "=$version" --root "$RUNNER_TEMP/auth-wasm-tools" wasm-bindgen-cli
          echo "WASM_BINDGEN_BIN=$RUNNER_TEMP/auth-wasm-tools/bin/wasm-bindgen" >> "$GITHUB_ENV"
      - name: Check contracts and run isolated tests
        run: npm test
      - name: Build web
        run: npm run build:web
      - name: Verify production WASM and Wrangler dry-run bundle
        run: node worker/scripts/verify-production-bundle.mjs

  dependency-audit:
    name: Dependency audit
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: 24.22.1
      - name: Audit Worker dependencies including dev dependencies
        continue-on-error: true
        run: npm --prefix worker audit --include=dev --audit-level=high || { echo "::warning title=Worker dependency audit::High/critical advisories found in worker dependencies (non-blocking visibility check)"; exit 1; }
      - name: Audit web production dependencies
        continue-on-error: true
        run: npm --prefix web audit --omit=dev --audit-level=high || { echo "::warning title=Web dependency audit::High/critical advisories found in web production dependencies (non-blocking visibility check)"; exit 1; }
