name: Development checks

# Validation only. Cloudflare non-production branch builds are disabled.
# Production release/deployment remains a separate, explicitly authorized task.
on:
  push:
    branches-ignore: [main]

permissions:
  contents: read

concurrency:
  group: development-checks-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Auth build and tests
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      CI: 'true'
      WRANGLER_SEND_METRICS: 'false'
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: 24.22.1
      - name: Install pinned dependencies and Rust tools
        run: npm run setup
      - name: Build the locked wasm-bindgen CLI
        run: |
          # worker-build otherwise fetches a prebuilt binary from GitHub Releases.
          version=$(awk -F '"' '/^name = "wasm-bindgen"$/ { getline; print $2; exit }' worker/rust/Cargo.lock)
          test -n "$version"
          toolchain=$(node --input-type=module -e "import { installedToolchain } from './worker/scripts/rust-toolchain.mjs'; process.stdout.write(installedToolchain())")
          cargo "+$toolchain" install --locked --version "=$version" --root "$RUNNER_TEMP/auth-wasm-tools" wasm-bindgen-cli
          echo "WASM_BINDGEN_BIN=$RUNNER_TEMP/auth-wasm-tools/bin/wasm-bindgen" >> "$GITHUB_ENV"
      - name: Check contracts and run isolated tests
        run: npm test
      - name: Build web and browser SDK
        run: npm run build:web && npm --prefix sdk/browser run build
      # npm test already builds the Worker WASM. No deploy, versions upload,
      # preview, remote D1 operation, artifact upload, or production secret.
