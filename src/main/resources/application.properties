spring.application.name=auth
# Deployment-controlled immutable platform administrator UUID whitelist; empty means no administrator.
auth.platform.admin-user-ids=${AUTH_PLATFORM_ADMIN_USER_IDS:}
# Opt-in deployment bootstrap: public console client only, never users/passwords/admin grants.
auth.console.enabled=${AUTH_CONSOLE_ENABLED:false}
auth.console.client-id=${AUTH_CONSOLE_CLIENT_ID:molis-auth-console}
# Requires Redis; mailbox account APIs also require mail.enabled and mail configuration.
auth.login.enabled=${AUTH_LOGIN_ENABLED:false}
# Third-party provider APIs are opt-in. No credentials or test providers are configured by default.
auth.federation.enabled=${AUTH_FEDERATION_ENABLED:false}
auth.federation.google.enabled=${AUTH_GOOGLE_ENABLED:false}
auth.federation.google.client-id=${AUTH_GOOGLE_CLIENT_ID:}
auth.federation.google.client-secret=${AUTH_GOOGLE_CLIENT_SECRET:}
auth.federation.apple.enabled=${AUTH_APPLE_ENABLED:false}
auth.federation.apple.client-id=${AUTH_APPLE_CLIENT_ID:}
auth.federation.apple.team-id=${AUTH_APPLE_TEAM_ID:}
auth.federation.apple.key-id=${AUTH_APPLE_KEY_ID:}
auth.federation.apple.private-key-base64=${AUTH_APPLE_PRIVATE_KEY_BASE64:}
auth.federation.crypto.active-key-id=${AUTH_PROVIDER_STATE_KEY_ID:primary}
auth.federation.crypto.keys.primary=${AUTH_PROVIDER_STATE_KEY:}
# Optional additive offline SHA256 blocklist. Invalid/missing configured files fail startup.
auth.password.blocklist-file=${AUTH_PASSWORD_BLOCKLIST_FILE:}
auth.mail.enabled=${AUTH_MAIL_ENABLED:false}
auth.mail.mode=${AUTH_MAIL_MODE:disabled}
auth.mail.origin=${AUTH_ISSUER:http://localhost:8080}
auth.mail.worker.enabled=${AUTH_MAIL_WORKER_ENABLED:false}
auth.mail.crypto.active-key-id=${AUTH_MAIL_KEY_ID:primary}
auth.mail.crypto.keys.primary=${AUTH_MAIL_KEY:}
auth.mail.smtp.host=${AUTH_SMTP_HOST:}
auth.mail.smtp.port=${AUTH_SMTP_PORT:587}
auth.mail.smtp.username=${AUTH_SMTP_USER:}
auth.mail.smtp.password=${AUTH_SMTP_PASSWORD:}
auth.mail.smtp.from=${AUTH_SMTP_FROM:}
auth.mail.smtp.implicit-tls=${AUTH_SMTP_IMPLICIT_TLS:false}
# Ephemeral stores are deliberately opt-in until the verification HTTP workflow is wired.
auth.ephemeral.enabled=${AUTH_EPHEMERAL_ENABLED:false}
spring.data.redis.host=${AUTH_REDIS_HOST:127.0.0.1}
spring.data.redis.port=${AUTH_REDIS_PORT:6379}
spring.data.redis.username=${AUTH_REDIS_USER:}
spring.data.redis.password=${AUTH_REDIS_PASSWORD:}
spring.data.redis.ssl.enabled=${AUTH_REDIS_TLS:false}
spring.data.redis.connect-timeout=1s
spring.data.redis.timeout=1s
spring.data.redis.repositories.enabled=false
management.health.redis.enabled=${AUTH_EPHEMERAL_ENABLED:false}
auth.issuer=${AUTH_ISSUER:http://localhost:8080}
server.address=${AUTH_BIND_ADDRESS:127.0.0.1}

# No built-in database credentials. Supply these via environment/external configuration.
spring.datasource.url=${AUTH_DB_URL}
spring.datasource.username=${AUTH_DB_USER}
spring.datasource.password=${AUTH_DB_PASSWORD}
spring.datasource.hikari.connection-timeout=3000
spring.datasource.hikari.data-source-properties.connectionTimeZone=UTC
spring.datasource.hikari.data-source-properties.forceConnectionTimeZoneToSession=true
spring.datasource.hikari.data-source-properties.preserveInstants=true
spring.flyway.clean-disabled=true
spring.flyway.validate-on-migrate=true
mybatis.configuration.map-underscore-to-camel-case=true
# Authentication decisions must not reuse a transaction-local snapshot from before a lock.
mybatis.configuration.local-cache-scope=statement
mybatis.configuration.cache-enabled=false
management.endpoint.health.show-details=never
server.error.include-message=never
server.error.include-stacktrace=never
auth.development.admin-enabled=${AUTH_DEVELOPMENT_ADMIN_ENABLED:false}
