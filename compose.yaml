# Local browser acceptance only. Never expose this stack to a public network.
name: molis-auth-local
services:
  init:
    image: molis-auth-local:dev
    build: .
    user: "0:0"
    entrypoint: ["/bin/sh", "/app/docker/init.sh"]
    volumes:
      - auth-secrets:/secrets/auth
      - db-secrets:/secrets/db
      - mail-tls:/secrets/mail
    network_mode: none

  mysql:
    image: mysql:8.4
    environment:
      MYSQL_DATABASE: auth_dev
      MYSQL_USER: auth
      MYSQL_PASSWORD_FILE: /secrets/password
      MYSQL_ROOT_PASSWORD_FILE: /secrets/root-password
    volumes:
      - mysql-data:/var/lib/mysql
      - db-secrets:/secrets:ro
    depends_on:
      init:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD-SHELL", 'MYSQL_PWD="$$(cat /secrets/password)" mysql --protocol=TCP -h 127.0.0.1 -u auth auth_dev -e "SELECT 1" >/dev/null']
      interval: 5s
      timeout: 5s
      retries: 40
      start_period: 30s
    networks: [backend]

  redis:
    image: redis:8.2-alpine
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20
    networks: [backend]

  mailpit:
    image: axllent/mailpit:v1.27.4
    user: "0:0"
    environment:
      MP_SMTP_TLS_CERT: /tls/mailpit.crt
      MP_SMTP_TLS_KEY: /tls/mailpit.key
      MP_SMTP_REQUIRE_STARTTLS: "true"
      MP_DATABASE: /data/mailpit.db
      MP_MAX_MESSAGES: "1000"
      MP_SMTP_DISABLE_RDNS: "true"
    ports:
      - "127.0.0.1:8025:8025"
    volumes:
      - mail-tls:/tls:ro
      - mail-data:/data
    depends_on:
      init:
        condition: service_completed_successfully
    networks: [backend, frontend]

  auth:
    image: molis-auth-local:dev
    build: .
    environment:
      AUTH_DB_URL: jdbc:mysql://mysql:3306/auth_dev?connectionTimeZone=UTC&allowPublicKeyRetrieval=true&sslMode=DISABLED
      AUTH_DB_USER: auth
      AUTH_REDIS_HOST: redis
      AUTH_REDIS_PORT: "6379"
      AUTH_ISSUER: http://localhost:8080
      AUTH_BIND_ADDRESS: 127.0.0.1
      SERVER_PORT: "8081"
      AUTH_LOGIN_ENABLED: "true"
      AUTH_EPHEMERAL_ENABLED: "true"
      AUTH_CONSOLE_ENABLED: "true"
      # Public fixture credentials admin@example.com/woyidingfacai. This stack must remain local-only.
      AUTH_DEVELOPMENT_ADMIN_ENABLED: "true"
      AUTH_PLATFORM_ADMIN_USER_IDS: ${AUTH_PLATFORM_ADMIN_USER_IDS:-826b9c2a-f24a-4ca6-a747-411a5579b643}
      AUTH_MAIL_ENABLED: "true"
      AUTH_MAIL_MODE: smtp
      AUTH_MAIL_WORKER_ENABLED: "true"
      AUTH_SMTP_HOST: mailpit
      AUTH_SMTP_PORT: "1025"
      AUTH_SMTP_FROM: auth@example.test
    volumes:
      - auth-secrets:/secrets:ro
    ports:
      - "127.0.0.1:8080:8080"
    depends_on:
      init:
        condition: service_completed_successfully
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
      mailpit:
        condition: service_started
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "http://127.0.0.1:8080/actuator/health"]
      interval: 5s
      timeout: 3s
      retries: 30
      start_period: 60s
    networks: [backend, frontend]

  smoke:
    image: node:22-bookworm-slim
    profiles: [test]
    network_mode: service:auth
    environment:
      SMOKE_MAIL_ORIGIN: http://mailpit:8025
    volumes:
      - ./docker/smoke.mjs:/smoke.mjs:ro
    command: ["node", "/smoke.mjs"]
    depends_on:
      auth:
        condition: service_healthy

networks:
  frontend:
  backend:
    internal: true
volumes:
  auth-secrets:
  db-secrets:
  mail-tls:
  mysql-data:
  redis-data:
  mail-data:
